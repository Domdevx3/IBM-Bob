version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    environment:
      - POSTGRES_DB=chatdb
      - POSTGRES_USER=chatuser
      - POSTGRES_PASSWORD=chatpass123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5433:5432"  # Use 5433 on host to avoid conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor de Chat con SSL
  chat-server:
    build:
      context: ..
      dockerfile: config/Dockerfile.server
    container_name: chat-server
    ports:
      - "5001:5000"  # Puerto del servidor de chat (host:container)
    volumes:
      - ../data:/app/data  # Persistencia de usuarios, historial, salas
      - ../certs:/app/certs  # Certificados SSL
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chatdb
      - DB_USER=chatuser
      - DB_PASSWORD=chatpass123
    networks:
      - chat-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # Cliente Flet (Interfaz Web)
  chat-client:
    build:
      context: ..
      dockerfile: config/Dockerfile.client
    container_name: chat-client-flet
    ports:
      - "8550:8550"  # Puerto web de Flet
    environment:
      - CHAT_SERVER_HOST=chat-server
      - CHAT_SERVER_PORT=5000
      - WATSONX_API_KEY=${WATSONX_API_KEY}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=chatdb
      - DB_USER=chatuser
      - DB_PASSWORD=chatpass123
    networks:
      - chat-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      chat-server:
        condition: service_started

networks:
  chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local

