version: '3.8'

services:
  # Servidor de Chat con SSL
  chat-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chat-server
    ports:
      - "5000:5000"  # Puerto del servidor de chat
    volumes:
      - ./data:/app/data  # Persistencia de usuarios, historial, salas
      - ./certs:/app/certs  # Certificados SSL
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost', 5000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cliente Flet (Interfaz Web)
  chat-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: chat-client-flet
    ports:
      - "8550:8550"  # Puerto web de Flet
    environment:
      - CHAT_SERVER_HOST=chat-server
      - CHAT_SERVER_PORT=5000
      - WATSONX_API_KEY=${WATSONX_API_KEY}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
    networks:
      - chat-network
    restart: unless-stopped
    depends_on:
      chat-server:
        condition: service_healthy

networks:
  chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

