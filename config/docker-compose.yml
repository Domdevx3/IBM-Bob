version: '3.8'

services:
  # Servidor de Chat con SSL - JSON Storage
  chat-server:
    build:
      context: ..
      dockerfile: config/Dockerfile.server
    container_name: chat-server
    ports:
      - "5001:5000"  # Puerto del servidor de chat (host:container)
    volumes:
      - ../data/json:/app/data/json  # Persistencia JSON: usuarios, historial, salas, pines
      - ../certs:/app/certs  # Certificados SSL
    environment:
      - DATA_DIR=/app/data
      - CERT_DIR=/app/certs
      - PYTHONPATH=/app
    networks:
      - chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/data/json/usuarios.json') else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Cliente Flet (Interfaz Web)
  chat-client:
    build:
      context: ..
      dockerfile: config/Dockerfile.client
    container_name: chat-client-flet
    ports:
      - "8550:8550"  # Puerto web de Flet
    volumes:
      - ../data/json:/app/data/json  # Acceso a datos JSON compartidos
    environment:
      - CHAT_SERVER_HOST=chat-server
      - CHAT_SERVER_PORT=5000
      - WATSONX_API_KEY=${WATSONX_API_KEY:-}
      - WATSONX_PROJECT_ID=${WATSONX_PROJECT_ID:-}
      - WATSONX_URL=${WATSONX_URL:-https://us-south.ml.cloud.ibm.com}
      - DATA_DIR=/app/data
      - PYTHONPATH=/app
    networks:
      - chat-network
    restart: unless-stopped
    depends_on:
      chat-server:
        condition: service_healthy

networks:
  chat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Made with Bob - 100% JSON Storage, Instant Startup, Production Ready
